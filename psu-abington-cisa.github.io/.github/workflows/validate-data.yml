name: Validate data

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/validate.py"
      - ".github/workflows/validate-data.yml"
  pull_request:
    paths:
      - "data/**"
      - "scripts/validate.py"
      - ".github/workflows/validate-data.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate data/events.json and data/board.json
        run: python3 scripts/validate.py
