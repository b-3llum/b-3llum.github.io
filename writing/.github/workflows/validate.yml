name: Validate write-ups

on:
  push:
    branches: [main]
    paths:
      - "posts/**"
      - "posts.json"
      - "tools/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "posts/**"
      - "posts.json"
      - "tools/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate posts.json and write-ups
        run: python3 tools/validate.py

      # The feed is a committed file (there is no build server), so rebuild
      # it here whenever write-ups change on main, and commit it if it moved.
      - name: Rebuild feed.xml
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 tools/build_feed.py
          if git diff --quiet -- feed.xml; then
            echo "feed.xml is up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Rebuild feed.xml" -- feed.xml
            git push
          fi
